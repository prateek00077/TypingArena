version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: backend_service
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/typeArena
      - NODE_ENV=development
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: frontend_service
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data: